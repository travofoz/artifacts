<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020713">
<title>Astral Energy Source Well</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020713;touch-action:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:flex;flex-direction:column;justify-content:space-between}
h1{margin:0;font-size:clamp(20px,6vw,40px);letter-spacing:.08em;text-transform:uppercase;background:linear-gradient(90deg,#46ffb0,#4aa8ff,#ffd36b);-webkit-background-clip:text;color:transparent;text-shadow:0 0 25px rgba(74,168,255,.22)}
p{margin:.45rem 0 0;max-width:36ch;line-height:1.4;font-size:13px;color:rgba(255,255,255,.72)}
.badge{align-self:flex-start;padding:9px 12px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#ffd36b}
#error{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:86vw;padding:16px 18px;border-radius:14px;background:rgba(15,0,20,.9);border:1px solid rgba(255,255,255,.15);display:none;z-index:5;line-height:1.45}
</style>
</head>
<body>
<div id="error"></div>
<div id="hud">
  <div>
    <h1>Astral Energy Source Well</h1>
    <p>A living convergence of memory, intention, and possibility.</p>
  </div>
  <div class="badge">drag · pinch · tap to pulse</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.min.js"></script>
<script>
(function(){
  const err = document.getElementById('error');
  function fail(msg){
    err.style.display='block';
    err.textContent=msg;
  }

  if(!window.THREE){
    fail('Three.js could not load. Open this file in Safari with an internet connection, rather than the in-app file preview.');
    return;
  }

  let renderer;
  try{
    renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
  }catch(e){
    fail('WebGL could not start in this viewer. Open the file directly in Safari.');
    return;
  }

  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.7));
  renderer.setSize(innerWidth,innerHeight);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.35;
  document.body.insertBefore(renderer.domElement,document.body.firstChild);

  const scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x020713,.045);

  const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,160);

  let yaw=0.0,pitch=.42,distance=11.5,targetYaw=0,targetPitch=.42,targetDistance=11.5;
  const target=new THREE.Vector3(0,.7,0);

  function updateCamera(){
    yaw+=(targetYaw-yaw)*.08;
    pitch+=(targetPitch-pitch)*.08;
    distance+=(targetDistance-distance)*.08;
    const cp=Math.cos(pitch),sp=Math.sin(pitch);
    camera.position.set(
      target.x + Math.sin(yaw)*cp*distance,
      target.y + sp*distance,
      target.z + Math.cos(yaw)*cp*distance
    );
    camera.lookAt(target);
  }

  const uniforms={uTime:{value:0},uPulse:{value:0}};

  // stars
  {
    const n=2000, g=new THREE.BufferGeometry();
    const p=new Float32Array(n*3), c=new Float32Array(n*3);
    const cols=[new THREE.Color('#46ffb0'),new THREE.Color('#4aa8ff'),new THREE.Color('#ffd36b')];
    for(let i=0;i<n;i++){
      const r=18+Math.random()*48,a=Math.random()*Math.PI*2,b=Math.acos(2*Math.random()-1);
      p[i*3]=Math.sin(b)*Math.cos(a)*r;
      p[i*3+1]=Math.cos(b)*r;
      p[i*3+2]=Math.sin(b)*Math.sin(a)*r;
      const cc=cols[i%3].clone().multiplyScalar(.35+Math.random()*.8);
      c[i*3]=cc.r;c[i*3+1]=cc.g;c[i*3+2]=cc.b;
    }
    g.setAttribute('position',new THREE.BufferAttribute(p,3));
    g.setAttribute('color',new THREE.BufferAttribute(c,3));
    scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:.075,vertexColors:true,transparent:true,opacity:.9,depthWrite:false,blending:THREE.AdditiveBlending})));
  }

  const poolMat=new THREE.ShaderMaterial({
    uniforms,
    transparent:true,
    depthWrite:false,
    side:THREE.DoubleSide,
    blending:THREE.AdditiveBlending,
    vertexShader:`
      varying vec2 vUv;
      uniform float uTime;
      void main(){
        vUv=uv;
        vec3 p=position;
        float r=length(p.xz);
        p.y+=sin(r*9.0-uTime*3.0)*.045;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);
      }`,
    fragmentShader:`
      precision highp float;
      varying vec2 vUv;
      uniform float uTime;
      uniform float uPulse;
      void main(){
        vec2 p=vUv-.5;
        float r=length(p)*2.0;
        float a=atan(p.y,p.x);
        float waves=.5+.5*sin(34.0*r-uTime*6.0+sin(a*6.0+uTime)*3.0);
        float spiral=.5+.5*sin(12.0*a-22.0*r+uTime*4.0);
        float pr=fract(uPulse)*1.3;
        float ring=exp(-abs(r-pr)*34.0)*step(.001,uPulse);
        vec3 blue=vec3(.04,.35,1.0);
        vec3 green=vec3(.05,1.0,.42);
        vec3 gold=vec3(1.0,.55,.08);
        vec3 col=mix(blue,green,spiral);
        col=mix(col,gold,pow(max(0.0,1.0-r),5.0));
        col*=.28+1.6*waves;
        col+=gold*ring*2.5;
        col+=green/(.08+20.0*r*r);
        float alpha=smoothstep(1.0,.02,r)*(.45+.55*waves);
        gl_FragColor=vec4(col,alpha);
      }`
  });
  const pool=new THREE.Mesh(new THREE.CircleGeometry(3.3,160),poolMat);
  pool.rotation.x=-Math.PI/2;
  pool.position.y=-.8;
  scene.add(pool);

  const colMat=new THREE.ShaderMaterial({
    uniforms,
    transparent:true,
    depthWrite:false,
    side:THREE.DoubleSide,
    blending:THREE.AdditiveBlending,
    vertexShader:`
      varying vec2 vUv;
      uniform float uTime;
      void main(){
        vUv=uv;
        vec3 p=position;
        float tw=p.y*1.6+uTime*1.4;
        float s=.16+.10*sin(p.y*3.0-uTime*2.0);
        p.x+=sin(tw*2.0)*s;
        p.z+=cos(tw*1.7)*s;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);
      }`,
    fragmentShader:`
      precision highp float;
      varying vec2 vUv;
      uniform float uTime;
      uniform float uPulse;
      void main(){
        float bands=.5+.5*sin(vUv.y*48.0-uTime*8.0+sin(vUv.y*10.0)*3.0);
        float edge=pow(max(0.0,1.0-abs(vUv.x-.5)*2.0),2.4);
        float pr=exp(-abs(vUv.y-fract(uPulse))*26.0)*step(.001,uPulse);
        vec3 c=mix(vec3(.04,.38,1.0),vec3(.05,1.0,.38),bands);
        c=mix(c,vec3(1.0,.62,.12),pow(vUv.y,3.0));
        c+=vec3(1.0,.62,.12)*pr*2.5;
        gl_FragColor=vec4(c,edge*(.15+.85*bands));
      }`
  });
  const column=new THREE.Mesh(new THREE.CylinderGeometry(.5,1.05,7.5,72,100,true),colMat);
  column.position.y=2.55;
  scene.add(column);

  const rings=new THREE.Group(); scene.add(rings);
  const ringCols=[0x46ffb0,0x4aa8ff,0xffd36b];
  for(let i=0;i<7;i++){
    const m=new THREE.Mesh(
      new THREE.TorusGeometry(2.0+i*.48,.018+(i%2)*.01,8,180),
      new THREE.MeshBasicMaterial({color:ringCols[i%3],transparent:true,opacity:.42,depthWrite:false,blending:THREE.AdditiveBlending})
    );
    m.rotation.x=Math.PI/2+(Math.random()-.5)*.45;
    m.rotation.y=Math.random()*Math.PI;
    m.userData.s=(i%2?1:-1)*(.3+i*.04);
    rings.add(m);
  }

  const crystals=new THREE.Group();scene.add(crystals);
  for(let i=0;i<16;i++){
    const a=i/16*Math.PI*2,r=4.1+(i%3)*.35;
    const m=new THREE.Mesh(
      new THREE.OctahedronGeometry(.22,0),
      new THREE.MeshBasicMaterial({color:ringCols[i%3],transparent:true,opacity:.9})
    );
    m.position.set(Math.cos(a)*r,-.05+Math.sin(i)*.35,Math.sin(a)*r);
    m.scale.y=2.3+(i%4)*.35;
    m.userData.ph=i*.7;
    crystals.add(m);
  }

  // particles
  const count=2600, pg=new THREE.BufferGeometry(), pp=new Float32Array(count*3), seeds=new Float32Array(count), pc=new Float32Array(count*3);
  const cc=[new THREE.Color('#46ffb0'),new THREE.Color('#4aa8ff'),new THREE.Color('#ffd36b')];
  for(let i=0;i<count;i++){seeds[i]=Math.random();const q=cc[i%3];pc[i*3]=q.r;pc[i*3+1]=q.g;pc[i*3+2]=q.b}
  pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
  pg.setAttribute('color',new THREE.BufferAttribute(pc,3));
  const pts=new THREE.Points(pg,new THREE.PointsMaterial({size:.06,vertexColors:true,transparent:true,opacity:.95,depthWrite:false,blending:THREE.AdditiveBlending}));
  scene.add(pts);

  scene.add(new THREE.AmbientLight(0x224466,1.2));
  const light=new THREE.PointLight(0x46ffb0,24,18,2);light.position.set(0,2,0);scene.add(light);

  function updateParticles(t){
    const a=pg.attributes.position.array;
    for(let i=0;i<count;i++){
      const s=seeds[i],lane=i%9;
      const h=((s*9+t*(.34+.03*lane))%9)-1.2;
      const taper=1-Math.min(1,Math.max(0,(h+1.2)/9))*.82;
      const r=.35+2.8*taper+.2*Math.sin(s*31+t*2+lane);
      const ang=s*24+t*(.85+.05*lane)+h*.95;
      a[i*3]=Math.cos(ang)*r;
      a[i*3+1]=h;
      a[i*3+2]=Math.sin(ang)*r;
    }
    pg.attributes.position.needsUpdate=true;
  }

  let dragging=false,lastX=0,lastY=0,pinchStart=0,distStart=0,moved=false;
  const cvs=renderer.domElement;

  cvs.addEventListener('pointerdown',e=>{
    dragging=true;lastX=e.clientX;lastY=e.clientY;moved=false;
    cvs.setPointerCapture?.(e.pointerId);
  });
  cvs.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const dx=e.clientX-lastX,dy=e.clientY-lastY;
    if(Math.abs(dx)+Math.abs(dy)>2)moved=true;
    targetYaw-=dx*.006;
    targetPitch=Math.max(-.15,Math.min(1.15,targetPitch+dy*.004));
    lastX=e.clientX;lastY=e.clientY;
  });
  cvs.addEventListener('pointerup',e=>{
    if(!moved)pulse=.001;
    dragging=false;
  });

  cvs.addEventListener('wheel',e=>{
    e.preventDefault();
    targetDistance=Math.max(4.8,Math.min(20,targetDistance+e.deltaY*.01));
  },{passive:false});

  cvs.addEventListener('touchstart',e=>{
    if(e.touches.length===2){
      const dx=e.touches[0].clientX-e.touches[1].clientX;
      const dy=e.touches[0].clientY-e.touches[1].clientY;
      pinchStart=Math.hypot(dx,dy);
      distStart=targetDistance;
    }
  },{passive:false});
  cvs.addEventListener('touchmove',e=>{
    if(e.touches.length===2){
      e.preventDefault();
      const dx=e.touches[0].clientX-e.touches[1].clientX;
      const dy=e.touches[0].clientY-e.touches[1].clientY;
      const d=Math.hypot(dx,dy);
      targetDistance=Math.max(4.8,Math.min(20,distStart*(pinchStart/d)));
    }
  },{passive:false});

  const clock=new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const t=clock.getElapsedTime();
    uniforms.uTime.value=t;
    if(pulse>0){pulse+=.018;if(pulse>1.9)pulse=0}
    uniforms.uPulse.value=pulse;
    column.rotation.y=t*.11;
    pool.rotation.z=-t*.05;
    rings.children.forEach((r,i)=>{r.rotation.z+=r.userData.s*.002;r.rotation.y+=Math.sin(t*.2+i)*.0007});
    crystals.children.forEach((c,i)=>{c.position.y=-.05+Math.sin(t*1.2+c.userData.ph)*.32;c.rotation.y+=.008});
    light.intensity=22+Math.sin(t*2)*4;
    updateParticles(t);
    updateCamera();
    renderer.render(scene,camera);
  }
  animate();

  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.7));
  });
})();
</script>
</body>
</html>
